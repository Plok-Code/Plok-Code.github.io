            </p>
            <p>
              Aujourd&rsquo;hui, je suis dipl&ocirc;m&eacute; <strong>Data Analyst</strong> &agrave; l&rsquo;issue

              (septembre 2025 - f&eacute;vrier 2026).
            </p>
            <details class="inline-preview-toggle">

            <p>
              De cette p&eacute;riode, je garde une grande rigueur m&eacute;thodique et un pragmatisme dans la prise de
              d&eacute;cision.
            </p>

          <template data-card-template="debut-voie-pro">
            <p class="muted">
              <em>Note aux recruteurs : mon parcours n'est pas lin&eacute;aire, j'en ai conscience. Je suis
              cependant convaincu qu'il repr&eacute;sente un v&eacute;ritable atout pour votre entreprise sur les m&eacute;tiers que je vise.</em>
            </p>
            <p>
              Apr&egrave;s mes &eacute;tudes, il fallait subvenir &agrave; mes besoins. Faute d'opportunit&eacute;s
              en informatique dans ma petite ville, j'ai commenc&eacute; par une multitude d'emplois alimentaires.
            </p>
            <p>
              En <strong>2015</strong>, j'ai lanc&eacute; mon activit&eacute; freelance &agrave; plein temps sur la
              c&ocirc;te, &agrave; Lacanau Oc&eacute;an. Je r&eacute;alisais de petits sites vitrines, du
              d&eacute;pannage hardware et de la formation informatique.
            </p>
            <p>
              De retour dans le B&eacute;arn, j'ai approfondi mes comp&eacute;tences en <strong>UI/UX Design</strong>
              pour compl&eacute;ter mon profil.
            </p>
            <p>
              Mon plan a toujours &eacute;t&eacute; de travailler dans les <strong>m&eacute;tiers du
              num&eacute;rique</strong>. Mais entre temps, le fait d'&ecirc;tre en couple et d'avoir des
              responsabilit&eacute;s m'a pouss&eacute; &agrave; choisir une voie <strong>plus stable que le
              freelancing</strong>. Et je n'avais alors <strong>ni les dipl&ocirc;mes pour viser un poste
              int&eacute;ressant, ni l'argent pour passer un dipl&ocirc;me</strong>.
            </p>
            <p>
              Mon plan est donc devenu le suivant : <strong>5 ans de CDI ouvrent droit &agrave; un Projet de
              Transition Professionnelle (PTP)</strong>. J'ai donc pris un <strong>CDI de r&eacute;ceptionniste de
              nuit en h&ocirc;tellerie pendant 5 ans</strong>, le temps d'amortir cet engagement, puis j'ai
              d&eacute;clench&eacute; le PTP qui m'a permis de viser un <strong>BAC+3 Data Analyst</strong>.
            </p>
            <p>
              Ce plan n'est pas termin&eacute; : mon objectif actuel est un <strong>BAC+5 dans le monde de la Data</strong>, via le contrat de professionnalisation que je recherche
              aujourd'hui.
            </p>

              J&rsquo;ai choisi de viser un de ces deux m&eacute;tiers car ils correspondent
              parfaitement &agrave; ma fa&ccedil;on de travailler : <strong>penser en syst&egrave;mes</strong>
              et <strong>concevoir des solutions concr&egrave;tes</strong>.
            </p>
            <p>
              Ces deux m&eacute;tiers partagent l&rsquo;essentiel : ils reposent sur les m&ecirc;mes
              fondations techniques (<strong>Python, SQL, pipelines de donn&eacute;es</strong>), la m&ecirc;me
              exigence de <strong>mise en production fiable</strong> (tests, conteneurisation, CI/CD), et la
              m&ecirc;me finalit&eacute; : faire le pont entre la <strong>donn&eacute;e brute</strong> et un
              <strong>service r&eacute;ellement utilisable</strong>, d&eacute;ploy&eacute; et adopt&eacute; sur le terrain.
            </p>
            <p>
              J&rsquo;ai construit ma trajectoire en deux &eacute;tapes :
            </p>
            <ul>

              <li><strong>&Eacute;tape 2 :</strong> ML ou Data Engineer en contrat de professionnalisation.</li>
            </ul>
            <p>
              Pendant l&rsquo;&eacute;tape 1, j&rsquo;ai valid&eacute; <strong>29 comp&eacute;tences r&eacute;parties
